name: macOS and Windows builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  CARGO_HOME: ${{ github.workspace }}/.cache/cargo
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo fetch --locked
      - run: python3 tools/check.py
      - run: python3 tools/cli_smoke.py
      - run: cargo build --locked --release --features desktop
      - run: python3 tools/package_macos.py
      - run: ditto -c -k --keepParent artifacts/FileSpring.app artifacts/FileSpring-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FileSpring-${{ matrix.os }}
          path: |
            artifacts/FileSpring-macos.zip
            docs/evidence/
  windows:
    # Server CI builds and tests do not replace Windows 10 / 11 desktop QA.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: FileSpring-windows-x64
          path: |
            artifacts/FileSpring-*-windows-x64-portable.zip*
            artifacts/windows-*.json
            docs/evidence/
