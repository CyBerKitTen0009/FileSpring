[package]
name = "filespring"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
description = "An offline-first native file workspace with reviewable operations"
default-run = "filespring"

[features]
default = []
desktop = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
file-id = "0.2.3"
fs2 = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "default_fonts", "system_fonts", "clipboard", "accesskit", "x11", "wayland"] }
rfd = { version = "0.16", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "filespring-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
